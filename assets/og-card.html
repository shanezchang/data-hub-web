<!DOCTYPE html>
<!-- OG 分享图源稿。渲染:浏览器开此文件,视口设 1200×630,截图存 ../og.png。
     字体走 Google Fonts,与站点一致(Newsreader / Hanken Grotesk / JetBrains Mono)。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'JetBrains Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
    background: #faf9f7; color: #1a1917;
    padding: 76px 88px; position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 34px; height: 34px; }
  .brand .word { font-weight: 600; font-size: 30px; letter-spacing: -.6px; }
  .eyebrow {
    font-size: 17px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase;
    color: #8b877d; margin-top: 8px;
  }
  h1 {
    font-weight: 700;
    font-size: 62px; line-height: 1.22; letter-spacing: -2px; max-width: 980px;
  }
  .snippet {
    font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #4a473f;
    background: #fff; border: 1px solid #eceae4; border-radius: 11px;
    padding: 18px 22px; align-self: flex-start;
  }
  .foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eceae4; padding-top: 26px; }
  .foot .host { font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #1a1917; letter-spacing: .3px; }
  .foot .tag { font-size: 16px; color: #8b877d; }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1917" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>
      <span class="word">data·hub</span>
    </div>
    <div class="eyebrow">可扩展的数据 API 平台</div>
  </div>

  <h1>把结构化数据,<br />变成给 AI 调用的接口。</h1>

  <div class="snippet">curl -H "X-API-Key: ···" "api.lumina-core.cn/v1/news?q=新能源"</div>

  <div class="foot">
    <span class="host">api.lumina-core.cn</span>
    <span class="tag">全文检索 · 自助 API key · 持续更新</span>
  </div>
</body>
</html>
